name: Veille

# Ce fichier doit vivre sur la branche par defaut : GitHub ne declenche les
# workflows planifies que depuis celle-ci. Le travail, lui, se fait sur la
# branche veille, que les etapes ci-dessous recuperent explicitement.

on:
  schedule:
    # 03h17 UTC : la nuit, et pas à l'heure pile, pour ne pas arriver en même
    # temps que tous les autres robots de la planète.
    - cron: '17 3 * * *'
  workflow_dispatch:

# Un seul relevé à la fois : deux exécutions concurrentes se marcheraient
# dessus au moment du commit.
concurrency:
  group: veille
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veille

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: npm ci

      - name: Relever l'état du site
        run: node veille.js

      - name: Régénérer la page
        run: node page.js

      - name: Consigner
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add donnees index.html
          if git diff --staged --quiet; then
            echo "Rien de neuf."
          else
            git commit -m "Relevé du $(date -u +%F)"
            git push
          fi
